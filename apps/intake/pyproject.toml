[project]
name = "intake"
version = "0.1.0"
description = "A metrics reception service for Metrics Collector"
authors = [
    { name = "Artem Shevchenko", email = "slendycs@yandex.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "models",
    "buffer",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "redis>=8.1.0",
    "httpx>=0.28.1",
]


[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
models = { workspace = true }
buffer = { workspace = true }

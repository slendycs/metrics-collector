[pytest]
testpaths = apps libs
python_files = test_*.py
addopts = -vv
          --alluredir=allure-results
          --junitxml=junit.xml
          --cov=agent
          --cov=intake
          --cov=models
          --cov=buffer
          --cov-report=term-missing
          --cov-report=html:htmlcov
          --cov-report=xml:coverage.xml

asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    unit: unit tests isolated from external systems
    integration: integration tests crossing a real component boundary
